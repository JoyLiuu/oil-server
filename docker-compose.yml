version: "3.8"

services:
  oil-server:
    build: .
    container_name: wx-oil-server
    ports:
      - "8000:8000"
    environment:
      - AMAP_KEY=${AMAP_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
