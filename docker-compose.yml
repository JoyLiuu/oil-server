version: "3.8"

services:
  oil-server:
    build: .
    container_name: wx-oil-server
    expose:
      - "8000"
    environment:
      - API_TOKEN=${API_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - oil-network

  nginx:
    image: nginx:alpine
    container_name: wx-oil-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - oil-server
    restart: unless-stopped
    networks:
      - oil-network

networks:
  oil-network:
    driver: bridge
